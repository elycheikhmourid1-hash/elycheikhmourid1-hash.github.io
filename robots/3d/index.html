<header id="top" class="top">
  <a class="brand" href="./" aria-label="AICore Robotics Ops 3D">
    <img src="../assets/img/favicon.svg" width="34" height="34" alt="">
    <span class="brand-t"><b data-i18n="app_title"></b><small data-i18n="app_sub"></small></span>
  </a>
  <a class="btn btn-ghost btn-sm" id="to2d" href="../"><svg class="ico flip"><use href="#i-back"/></svg><span data-i18n="to2d"></span></a>
  <span class="sp"></span>
  <button class="btn btn-primary btn-sm" id="pres" type="button" aria-pressed="false"><svg class="ico"><use href="#i-play"/></svg><span id="pres-t"></span></button>
  <button class="btn btn-ghost btn-sm" id="fs" type="button" aria-pressed="false"><svg class="ico"><use href="#i-full"/></svg><span id="fs-t"></span></button>
  <div class="seg" id="langs" role="group" data-i18n-aria="lang_aria">
    <button type="button" data-lang="ar" lang="ar">العربية</button><button type="button" data-lang="fr" lang="fr">Français</button><button type="button" data-lang="en" lang="en">English</button>

<main id="view" class="view">
  <div id="labels" class="labels" aria-hidden="true"></div>
  <div id="camtools" class="camtools" role="group" data-i18n-aria="cam_aria">
    <button type="button" data-cam="overview"><span data-i18n="cam_overview"></span></button>
    <button type="button" data-cam="dish"><span data-i18n="cam_dish"></span></button>
    <button type="button" data-cam="cabinets"><span data-i18n="cam_cabinets"></span></button>
    <button type="button" id="cam-follow" aria-pressed="false"><span data-i18n="cam_follow"></span></button>
    <button type="button" id="cam-cine" aria-pressed="false"><svg class="ico"><use href="#i-orbit"/></svg><span data-i18n="cam_cine"></span></button>
  </div>
  <div id="vtl" class="vtl">
    <div id="livebar" class="livebar" role="status" aria-label="LIVE / SIMULATION">
      <div class="lb-legend"><span class="live-badge" title="" id="lb-live"><i></i>LIVE / حي</span><span class="lb-t" data-i18n="lv_legend_live_s"></span><span class="sim-tag" data-i18n="lv_sim_tag"></span><span class="lb-t" data-i18n="lv_legend_sim_s"></span></div>
      <div class="lb-chips" id="lb-chips"></div>
    </div>
    <div class="geo-banner" id="geo-banner" role="note">
      <p class="geo-note" data-i18n="geo_note"></p>
      <p class="geo-context" data-i18n="geo_context"></p>
    </div>
    <div id="sat-readout" class="sat-readout">
      <p class="sr-dish"></p>
      <p class="sr-pt"></p>
      <p class="sr-ku"></p>
    </div>
    <div id="heat-legend" class="heat-legend" hidden><b data-i18n="heat_legend"></b><i></i><span><bdi class="ltr">30 °C</bdi><bdi class="ltr">70 °C</bdi></span></div>
  </div>
  <div class="m-dock" id="m-dock">
    <div class="sim-badge" role="status"><i class="pulse-dot"></i><span data-i18n="badge" dir="auto">SIMULATION / عرض تجريبي - بيانات افتراضية</span></div>
    <button type="button" class="m-chip" data-sheet="live" aria-pressed="false" aria-controls="m-sheet"><span data-i18n="m_live"></span></button>
    <button type="button" class="m-chip" data-sheet="sat" aria-pressed="false" aria-controls="m-sheet"><span data-i18n="m_sat"></span></button>
    <button type="button" class="m-chip" data-sheet="info" aria-pressed="false" aria-controls="m-sheet"><span data-i18n="m_info"></span></button>
    <button type="button" class="m-chip" data-sheet="tasks" aria-pressed="false" aria-controls="m-sheet"><span data-i18n="m_tasks"></span></button>
  </div>
  <div class="m-sheet" id="m-sheet" hidden>
    <div class="m-sheet-h"><b id="m-sheet-t"></b><button type="button" class="m-x" id="m-sheet-x" data-i18n-aria="m_close">×</button></div>
    <div class="m-sheet-b" id="m-sheet-b"></div>

    <p class="fb-msg" data-i18n="fb_msg"></p>

<section id="hud" class="hud" aria-live="polite" aria-label="Mission control"></section>

<aside id="panel" class="panel" tabindex="-1">
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="missions" aria-selected="true" id="tab-missions"><span data-i18n="tab_missions"></span><i class="dot" id="nb-missions" hidden></i></button>
    <button role="tab" data-tab="command" aria-selected="false" id="tab-command"><span data-i18n="tab_command"></span></button>
    <button role="tab" data-tab="live" aria-selected="false" id="tab-live"><span data-i18n="tab_live"></span></button>
    <button role="tab" data-tab="alerts" aria-selected="false" id="tab-alerts"><span data-i18n="tab_alerts"></span><i class="dot" id="nb-alerts" hidden></i></button>
    <button role="tab" data-tab="audit" aria-selected="false" id="tab-audit"><span data-i18n="tab_audit"></span></button>
    <button role="tab" data-tab="about" aria-selected="false" id="tab-about"><span data-i18n="tab_about"></span></button>
  </div>
  <div class="tabpanel" id="p-missions" role="tabpanel" aria-labelledby="tab-missions">
    <h2 class="sec" data-i18n="fleet_title"></h2>
    <div id="fleet" class="fleet"></div>

  </div>
  <div class="tabpanel" id="p-command" role="tabpanel" aria-labelledby="tab-command" hidden>
    <h2 class="sec" data-i18n="cmd_title"></h2>
    <p class="banner" data-i18n="cmd_banner"></p>
    <form id="cmd-form" class="cmd-form" autocomplete="off">
      <label class="sr" for="cmd" data-i18n="cmd_label"></label>
      <input id="cmd" type="text" maxlength="160" data-i18n-ph="cmd_ph" enterkeyhint="send">
      <button class="btn btn-primary" id="cmd-go" type="submit"><svg class="ico flip"><use href="#i-send"/></svg><span data-i18n="cmd_go"></span></button>
    </form>
    <p class="tiny muted" data-i18n="cmd_examples"></p>
    <div id="cmd-chips" class="chips"></div>
    <div id="cmd-out" class="cmd-out" aria-live="polite"></div>
  </div>
  <div class="tabpanel" id="p-live" role="tabpanel" aria-labelledby="tab-live" hidden>
    <div class="lv-legend lv-legend-p" role="group" data-i18n-aria="lv_legend_title">
      <b data-i18n="lv_legend_title"></b>
      <span class="lg"><span class="live-badge"><i></i>LIVE / حي</span><span data-i18n="lv_legend_live"></span></span>
      <span class="lg"><span class="sim-tag" data-i18n="lv_sim_tag"></span><span data-i18n="lv_legend_sim"></span></span>
    </div>

    <section class="lv-sec" id="lv-wx" aria-labelledby="lv-wx-h">
      <h2 class="sec" id="lv-wx-h"><span data-i18n="lv_wx_title"></span> <span class="live-badge"><i></i>LIVE / حي</span></h2>
      <div class="wx-tools">
        <label><span data-i18n="lv_wx_thr"></span><input type="number" id="wx-thr" min="5" max="150" step="1" inputmode="numeric"></label>
        <label><span data-i18n="lv_wx_rain_thr"></span><input type="number" id="wx-rain" min="0" max="50" step="0.1" inputmode="decimal"></label>
        <button class="btn btn-ghost btn-sm" id="wx-refresh" type="button"><svg class="ico"><use href="#i-reset"/></svg><span data-i18n="lv_wx_refresh"></span></button>
      </div>
      <div class="wx-cards" id="wx-cards"></div>
      <p class="tiny muted wx-note" data-i18n="lv_wx_src"></p>
      <p class="tiny muted wx-note" data-i18n="lv_wx_thr_note"></p>
      <p class="tiny muted wx-note" data-i18n="lv_wx_rain_note"></p>
      <p class="tiny wx-note" id="wx-adv" role="status"></p>
    </section>

    <section class="lv-sec" id="lv-pt" aria-labelledby="lv-pt-h">
      <h2 class="sec" id="lv-pt-h"><span data-i18n="lv_pt_title"></span> <span class="live-badge"><i></i>LIVE / حي</span></h2>
      <p class="banner banner-live" data-i18n="lv_pt_note"></p>
      <label class="fld"><span class="tiny" data-i18n="lv_pt_sat"></span><select id="sat-sel"></select></label>
      <dl class="pt-grid" id="pt-out"></dl>
      <p class="tiny muted" data-i18n="lv_pt_generic"></p>
      <p class="tiny muted" data-i18n="lv_pt_station"></p>
      <p class="tiny muted" data-i18n="lv_pt_skew_note"></p>
      <p class="tiny muted" data-i18n="lv_pt_scene"></p>
    </section>

    <section class="lv-sec" id="lv-cam" aria-labelledby="lv-cam-h">
      <h2 class="sec" id="lv-cam-h"><span data-i18n="lv_cam_title"></span> <span class="live-badge" id="cam-badge" hidden><i></i>LIVE / حي</span></h2>
      <p class="banner banner-priv" data-i18n="lv_cam_priv"></p>
      <div class="cam-box" id="cam-box" hidden><video id="cam-video" playsinline muted></video><canvas id="cam-ov" aria-hidden="true"></canvas></div>
      <div class="row-acts">
        <button class="btn btn-primary btn-sm" id="cam-start" type="button"><span data-i18n="lv_cam_start"></span></button>
        <button class="btn btn-ghost btn-sm" id="cam-stop" type="button" disabled><span data-i18n="lv_cam_stop"></span></button>
      </div>
      <p class="small" id="cam-status" role="status"></p>
      <p class="small" id="cam-counts"></p>
      <p class="tiny muted" data-i18n="lv_cam_gate"></p>
      <p class="tiny muted" id="cam-frames"></p>
      <p class="tiny muted" data-i18n="lv_cam_note"></p>
    </section>

    <section class="lv-sec" id="lv-sn" aria-labelledby="lv-sn-h">
      <h2 class="sec" id="lv-sn-h"><span data-i18n="lv_sn_title"></span> <span id="sn-badge"></span></h2>
      <p class="small" id="sn-status" role="status"></p>
      <p class="small" id="sn-reading"></p>
      <div class="sn-row">
        <label class="fld"><span class="tiny" data-i18n="lv_sn_cab"></span><select id="sn-cab"><option>A</option><option selected>B</option><option>C</option></select></label>
        <label class="fld"><span class="tiny" data-i18n="lv_sn_thr"></span><input type="number" id="sn-thr" min="20" max="120" step="0.5" inputmode="decimal"></label>
      </div>
      <div class="row-acts"><button class="btn btn-ghost btn-sm" id="sn-settings" type="button"><span data-i18n="lv_sn_settings"></span></button></div>
      <label class="chk"><input type="checkbox" id="sn-sim"><span data-i18n="lv_sn_sim"></span> <span class="sim-tag" data-i18n="lv_sn_simtag"></span></label>
      <label class="fld" id="sn-sim-wrap" hidden><span class="tiny"><span data-i18n="lv_sn_sim_val"></span>: <bdi class="ltr" id="sn-sim-out">38</bdi> °C</span><input type="range" id="sn-sim-val" min="25" max="70" step="0.5" value="38"></label>
      <p class="tiny muted" data-i18n="lv_sn_sim_note"></p>
      <p class="tiny muted" data-i18n="lv_sn_how"></p>
    </section>
    <p class="tiny muted" data-i18n="lv_net_note"></p>
  </div>
  <div class="tabpanel" id="p-alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden>
    <h2 class="sec"><span data-i18n="al_title"></span> <span class="chip sim-chip">SIMULATED</span></h2>
    <p class="note" data-i18n="al_lead"></p>
    <div class="row-acts">
      <button class="btn btn-ghost btn-sm" id="al-sim" type="button"><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="al_sim"></span></button>
      <button class="btn btn-primary btn-sm" id="al-dispatch" type="button"><svg class="ico flip"><use href="#i-send"/></svg><span data-i18n="al_dispatch"></span></button>
    </div>
    <label class="chk"><input type="checkbox" id="al-feed" checked><span data-i18n="al_feed"></span></label>
    <div id="alerts" class="alerts"></div>
  </div>
  <div class="tabpanel" id="p-audit" role="tabpanel" aria-labelledby="tab-audit" hidden>
    <h2 class="sec" data-i18n="au_title"></h2>
    <p class="note" data-i18n="au_lead"></p>
    <button class="btn btn-ghost btn-sm" id="csv" type="button"><svg class="ico"><use href="#i-down"/></svg><span data-i18n="au_csv"></span></button>
    <div class="tbl-wrap"><table class="tbl" id="au-table"></table></div>
  </div>
  <div class="tabpanel" id="p-about" role="tabpanel" aria-labelledby="tab-about" hidden>
    <div id="about"></div>
    <button class="btn btn-ghost btn-sm" id="reset" type="button"><svg class="ico"><use href="#i-reset"/></svg><span data-i18n="reset"></span></button>
  </div>
</aside>
