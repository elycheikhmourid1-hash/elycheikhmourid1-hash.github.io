<!-- hidden route geometry (used to sample robot paths) -->
<svg id="routes" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"></svg>

<!-- background: glow grid + fiber-optic lines -->
<div class="bg-grid" aria-hidden="true"></div>
<svg class="bg-fiber" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="fg1" x1="0" x2="1"><stop offset="0" stop-color="#c21fdc"/><stop offset=".5" stop-color="#9810fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="fg2" x1="1" x2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a24aff"/></linearGradient>
  </defs>
  <path class="fb" stroke="url(#fg1)" d="M-40 700 C 280 560, 520 860, 820 640 S 1280 420, 1500 520"/>
  <path class="fb pulse" stroke="url(#fg1)" d="M-40 700 C 280 560, 520 860, 820 640 S 1280 420, 1500 520"/>
  <path class="fb" stroke="url(#fg2)" d="M-40 180 C 320 320, 560 40, 900 220 S 1300 360, 1500 140"/>
  <path class="fb pulse p2" stroke="url(#fg2)" d="M-40 180 C 320 320, 560 40, 900 220 S 1300 360, 1500 140"/>
  <path class="fb" stroke="url(#fg1)" d="M200 -30 C 320 260, 140 480, 360 930"/>

<a class="skip" href="#main" data-i18n="skip">تخطَّ إلى المحتوى</a>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/dashboard" aria-label="AICore Robotics Ops">
      <img src="assets/img/favicon.svg" width="38" height="38" alt="">
      <span class="brand-t"><b data-i18n="app_title">عمليات الروبوتات — AICore</b><small data-i18n="app_sub"></small></span>
    </a>
    <nav class="tabs" id="nav" aria-label="Main">
      <a href="#/dashboard" data-route="dashboard"><svg class="ico"><use href="#i-dash"/></svg><span data-i18n="nav_dashboard"></span></a>
      <a href="#/missions" data-route="missions"><svg class="ico"><use href="#i-mission"/></svg><span data-i18n="nav_missions"></span><i class="dot" id="nb-missions" hidden></i></a>
      <a href="#/alerts" data-route="alerts"><svg class="ico"><use href="#i-alert"/></svg><span data-i18n="nav_alerts"></span><i class="dot" id="nb-alerts" hidden></i></a>
      <a href="#/audit" data-route="audit"><svg class="ico"><use href="#i-log"/></svg><span data-i18n="nav_audit"></span></a>
      <a href="#/roadmap" data-route="roadmap"><svg class="ico"><use href="#i-road"/></svg><span data-i18n="nav_roadmap"></span></a>
    </nav>
    <button class="btn btn-ghost btn-sm lang" id="lang" type="button"><svg class="ico"><use href="#i-globe"/></svg><span id="lang-t"></span></button>
  </div>
  <div class="console">
    <label class="op"><span data-i18n="operator">المشغّل</span>
      <select id="op"></select></label>
    <span class="clock"><span data-i18n="clock"></span> <bdi class="ltr" id="clock">--:--:--</bdi></span>
    <button class="btn btn-ghost btn-sm" id="reset" type="button"><svg class="ico"><use href="#i-reset"/></svg><span data-i18n="reset"></span></button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- DASHBOARD -->
  <section class="view" id="v-dashboard" data-view="dashboard" aria-labelledby="h-dash">
    <div class="vh"><h1 id="h-dash" data-i18n="dash_title"></h1><p class="lead" data-i18n="dash_lead"></p></div>
    <div class="kpis" id="kpis"></div>
    <div class="dash-grid">
      <div class="card map-card">
        <div class="ch"><h2 data-i18n="map_title"></h2><span class="tiny muted" data-i18n="map_note"></span></div>
        <div class="map-wrap"><svg id="map" viewBox="0 0 640 640" role="group" focusable="false"></svg></div>
        <ul class="legend tiny">
          <li><i class="lg ok"></i><span data-i18n="legend_ok"></span></li><li><i class="lg att"></i><span data-i18n="legend_att"></span></li>
          <li><i class="lg mis"></i><span data-i18n="legend_mis"></span></li><li><i class="lg link"></i><span data-i18n="legend_link"></span></li>
        </ul>
      </div>
      <div class="card plan-card">
        <div class="ch"><h2 data-i18n="plan_title"></h2></div>
        <div class="site-tabs" id="site-tabs" role="group" data-i18n-aria="sites_tabs"></div>
        <div class="plan-head" id="plan-head"></div>
        <div class="plan-wrap"><svg id="plan" viewBox="0 0 400 260" role="img" focusable="false"></svg></div>
        <h3 class="sub" data-i18n="robots_here"></h3>
        <div id="robot-list" class="rlist"></div>
      </div>
    </div>
    <div id="roles-dash"></div>
  </section>

  <!-- MISSIONS -->
  <section class="view" id="v-missions" data-view="missions" aria-labelledby="h-mi" hidden>
    <div class="vh"><h1 id="h-mi" data-i18n="mi_title"></h1><p class="lead" data-i18n="mi_lead"></p></div>
    <h2 class="sec" data-i18n="mi_templates"></h2>
    <div class="tpl-grid" id="tpl-grid"></div>
    <h2 class="sec" data-i18n="mi_board"></h2>
    <div id="board" class="board"></div>
  </section>

  <!-- ALERTS -->
  <section class="view" id="v-alerts" data-view="alerts" aria-labelledby="h-al" hidden>
    <div class="vh vh-row">
      <div><h1 id="h-al" data-i18n="al_title"></h1><p class="lead" data-i18n="al_lead"></p></div>
      <button class="btn btn-primary" id="sim-alert" type="button"><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="al_sim"></span></button>
    </div>
    <div id="alerts" class="alerts"></div>
  </section>

  <!-- AUDIT -->
  <section class="view" id="v-audit" data-view="audit" aria-labelledby="h-au" hidden>
    <div class="vh vh-row">
      <div><h1 id="h-au" data-i18n="au_title"></h1><p class="lead" data-i18n="au_lead"></p></div>
      <button class="btn btn-ghost" id="csv" type="button"><svg class="ico"><use href="#i-down"/></svg><span data-i18n="au_csv"></span></button>
    </div>
    <div class="chips" id="au-filter" role="group"></div>
    <div class="card tbl-card"><table class="tbl" id="au-table"></table></div>
    <div id="roles-audit"></div>
  </section>

  <!-- ROADMAP -->
  <section class="view" id="v-roadmap" data-view="roadmap" aria-labelledby="h-rm" hidden>
    <div class="vh"><h1 id="h-rm" data-i18n="rm_title"></h1><p class="lead" data-i18n="rm_lead"></p></div>
    <div id="roadmap"></div>
  </section>
</main>

      <h2 data-i18n="ct_title"></h2>
      <p class="muted" data-i18n="ct_role"></p>
      <p class="tiny muted" data-i18n="ct_note"></p>
    </div>

      <li><a href="mailto:elycheikh@aicoredigital.com"><svg class="ico"><use href="#i-mail"/></svg><span class="ltr">elycheikh@aicoredigital.com</span></a></li>

<!-- persistent simulation badge -->
<div class="sim-badge" role="status"><i class="pulse-dot"></i><span data-i18n="badge" dir="auto">SIMULATION / عرض تجريبي - بيانات افتراضية</span></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- report overlay (print target) -->
<div id="report" class="report-ov" role="dialog" aria-modal="true" aria-labelledby="rp-h" hidden>
  <div class="report-bar no-print">
    <button class="btn btn-primary btn-sm" id="rp-print" type="button"><svg class="ico"><use href="#i-print"/></svg><span data-i18n="rp_print"></span></button>
    <button class="btn btn-ghost btn-sm" id="rp-dl" type="button"><svg class="ico"><use href="#i-down"/></svg><span data-i18n="rp_download"></span></button>
    <button class="btn btn-ghost btn-sm" id="rp-close" type="button"><svg class="ico"><use href="#i-x"/></svg><span data-i18n="rp_close"></span></button>
  </div>
  <article class="paper" id="paper"></article>
</div>
