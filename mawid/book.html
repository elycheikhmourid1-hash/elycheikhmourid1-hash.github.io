<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071422">
  <title>AICore موعد – احجز موعدك · عيادة الأمل (نموذج تجريبي)</title>
  <meta name="description" content="Demo — AICore Mawʿid patient booking page. Fictional data.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Cairo-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="page-book">
  <header class="appbar">
    <div class="appbar-top">
      <div class="brand" id="brand"></div>
      <div class="appbar-actions">
        <a class="pill-btn" id="myBtn" href="mes-rendez-vous.html"></a>
        <button class="pill-btn" id="langBtn" type="button"></button>
      </div>
    </div>
    <div class="clinic-line" id="clinicLine"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
  </header>

  <main class="container" id="formView">
    <form id="bookForm" novalidate>
      <!-- anti-spam honeypot: humans never see or fill this field -->
      <div class="hp-field" aria-hidden="true">
        <label>Website <input type="text" id="fWebsite" name="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <section class="card" id="secService">
        <div class="card-title"><span class="step-num">1</span><span data-i18n="step_service"></span></div>
        <div class="svc-grid" id="svcGrid"></div>
        <div class="err-msg hidden" id="errService"></div>
      </section>
      <section class="card" id="secDate">
        <div class="card-title"><span class="step-num">2</span><span data-i18n="step_date"></span></div>
        <div class="days" id="days"></div>
        <div class="err-msg hidden" id="errDate"></div>
      </section>
      <section class="card" id="secTime">
        <div class="card-title"><span class="step-num">3</span><span data-i18n="step_time"></span></div>
        <div id="slotsWrap"></div>
        <div class="err-msg hidden" id="errTime"></div>
      </section>
      <section class="card" id="secInfo">
        <div class="card-title"><span class="step-num">4</span><span data-i18n="step_info"></span></div>
        <label class="field"><span class="label" data-i18n="f_name"></span>
          <input class="input" id="fName" name="name" autocomplete="name" data-i18n-ph="f_name_ph" maxlength="60" dir="auto">
          <div class="err-msg hidden" id="errName"></div>
        </label>
        <label class="field"><span class="label" data-i18n="f_phone"></span>
          <div class="phone-group"><span class="prefix">+222</span>
            <input class="input" id="fPhone" name="phone" inputmode="numeric" autocomplete="tel-national" data-i18n-ph="f_phone_ph" maxlength="11"></div>
          <div class="err-msg hidden" id="errPhone"></div>
        </label>
        <label class="field"><span class="label" data-i18n="f_note"></span>
          <textarea class="textarea" id="fNote" name="note" data-i18n-ph="f_note_ph" maxlength="240" dir="auto"></textarea>
        </label>
        <label class="check" style="margin-top:12px"><input type="checkbox" id="fDeposit"><span data-i18n="f_deposit"></span></label>
        <div class="consent" id="consent"></div>
      </section>
      <div class="summary-bar">
        <div class="summary-line" id="summaryLine"></div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn"></button>
      </div>
    </form>
  </main>

  <main class="container hidden" id="successView"></main>

  <footer class="footer">
    <div class="tagline" data-i18n="tagline"></div>
    <div><b>AICore موعد</b> · <span data-i18n="footer"></span></div>
    <div style="margin-top:6px"><a href="mes-rendez-vous.html" class="tiny">مواعيدي · Mes rendez-vous</a> · <a href="index.html" class="tiny" id="staffLink">لوحة الموظفين · Espace équipe</a></div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/notify.js"></script>
  <script src="assets/js/fiber.js"></script>
  <script src="assets/js/book.js"></script>
</body>
</html>
